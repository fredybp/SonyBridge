name: macOS

on:
  push:
    branches:
    - main
    - 'feature/**'
  pull_request:
    branches:
    - main
  workflow_dispatch:

jobs:
  build:
    # The Swift app targets macOS 26 and uses Xcode 27's project format.
    runs-on: macos-26
    env:
      # CI has no signing team: sign ad-hoc, which keeps the app's entitlements (sandbox + Bluetooth).
      SIGNING: CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode 27
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27'

    - name: Test
      working-directory: ${{github.workspace}}/Client/SonyBridge
      run: xcodebuild test -project SonyBridge.xcodeproj -scheme SonyBridge -destination 'platform=macOS' $SIGNING

    - name: Build the release app
      working-directory: ${{github.workspace}}/Client/SonyBridge
      run: xcodebuild build -project SonyBridge.xcodeproj -scheme SonyBridge -configuration Release -destination 'generic/platform=macOS' -derivedDataPath build $SIGNING

    - name: Zip the app
      working-directory: ${{github.workspace}}/Client/SonyBridge/build/Build/Products/Release
      run: ditto -c -k --keepParent SonyBridge.app SonyBridge-macOS.zip

    - name: Upload the zipped app
      uses: actions/upload-artifact@v4
      with:
        name: SonyBridge-macOS
        path: ${{github.workspace}}/Client/SonyBridge/build/Build/Products/Release/SonyBridge-macOS.zip
        if-no-files-found: error
